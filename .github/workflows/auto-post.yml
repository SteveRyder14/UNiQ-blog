name: Automatic Game Development Updates

on:
  workflow_dispatch:
  schedule:
    # 09:00 India Standard Time (03:30 UTC)
    - cron: "30 3 * * *"

permissions:
  contents: read

concurrency:
  group: automatic-game-development-updates
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get blog repository code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate and publish game-hub development update
        run: node scripts/auto-post.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SOURCE_REPOSITORY: SteveRyder14/game-hub
          SOURCE_REPOSITORY_TOKEN: ${{ secrets.SOURCE_REPOSITORY_TOKEN }}
